spring.datasource.url=jdbc:h2:mem:risk_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

risk.device-fingerprint.pepper=test-only-device-fingerprint-pepper-value
risk.authentication-history.pepper=test-only-authentication-history-pepper-value
risk.security.issuer-uri=http://localhost:8180/realms/DoAn
risk.security.jwk-set-uri=http://localhost:8180/realms/DoAn/protocol/openid-connect/certs
risk.security.require-https=false
management.health.redis.enabled=false
