spring.application.name=risk-scoring-service

server.port=${RISK_SERVICE_PORT:8081}
server.address=${RISK_BIND_ADDRESS:127.0.0.1}
server.forward-headers-strategy=none

# Explicit dev profile is required for local HTTP. No authentication bypass exists.
risk.security.issuer-uri=${RISK_JWT_ISSUER_URI}
risk.security.jwk-set-uri=${RISK_JWT_JWK_SET_URI}
risk.security.audience=${RISK_JWT_AUDIENCE:zerotrust-risk-api}
risk.security.allowed-client-id=${RISK_JWT_ALLOWED_CLIENT_ID:zerotrust-risk-caller}
risk.security.require-https=true

spring.datasource.url=${RISK_DB_URL:jdbc:mysql://localhost:3306/risk_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${RISK_DB_USERNAME:root}
spring.datasource.password=${RISK_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${RISK_JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

risk.device-fingerprint.pepper=${RISK_DEVICE_FINGERPRINT_PEPPER}

spring.data.redis.host=${RISK_REDIS_HOST:localhost}
spring.data.redis.port=${RISK_REDIS_PORT:6379}
spring.data.redis.password=${RISK_REDIS_PASSWORD:}
spring.data.redis.connect-timeout=${RISK_REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${RISK_REDIS_COMMAND_TIMEOUT:2s}
spring.data.redis.ssl.enabled=${RISK_REDIS_SSL:true}
spring.data.redis.repositories.enabled=false

risk.authentication-history.pepper=${RISK_AUTH_HISTORY_PEPPER}
risk.authentication-history.key-prefix=${RISK_AUTH_HISTORY_KEY_PREFIX:zerotrust:risk:auth-history}
risk.authentication-history.failure-window=${RISK_AUTH_FAILURE_WINDOW:PT15M}
risk.authentication-history.event-deduplication-ttl=${RISK_AUTH_EVENT_DEDUPLICATION_TTL:PT1H}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

info.app.name=Risk Scoring Service
info.app.description=Adaptive authentication risk evaluation

# TBD: development-only baseline. Replace these values after the risk policy is approved.
risk.policy.weights.device=${RISK_WEIGHT_DEVICE:0.25}
risk.policy.weights.network=${RISK_WEIGHT_NETWORK:0.25}
risk.policy.weights.temporal=${RISK_WEIGHT_TEMPORAL:0.25}
risk.policy.weights.authentication-history=${RISK_WEIGHT_AUTHENTICATION_HISTORY:0.25}
risk.policy.thresholds.medium-minimum=${RISK_THRESHOLD_MEDIUM_MINIMUM:40}
risk.policy.thresholds.high-minimum=${RISK_THRESHOLD_HIGH_MINIMUM:75}

# TBD: development-only device-risk scores. Replace after policy approval.
risk.policy.device-risk.missing=${RISK_DEVICE_SCORE_MISSING:80}
risk.policy.device-risk.new-device=${RISK_DEVICE_SCORE_NEW:60}
risk.policy.device-risk.pending=${RISK_DEVICE_SCORE_PENDING:50}
risk.policy.device-risk.trusted=${RISK_DEVICE_SCORE_TRUSTED:0}
risk.policy.device-risk.revoked=${RISK_DEVICE_SCORE_REVOKED:100}

# TBD: development-only failure bands. Account thresholds are intentionally lower
# than source-IP thresholds because shared IPs/NAT are weaker identity signals.
risk.policy.authentication-history-risk.subject-medium-minimum=${RISK_AUTH_SUBJECT_MEDIUM_MINIMUM:3}
risk.policy.authentication-history-risk.subject-high-minimum=${RISK_AUTH_SUBJECT_HIGH_MINIMUM:5}
risk.policy.authentication-history-risk.source-ip-medium-minimum=${RISK_AUTH_IP_MEDIUM_MINIMUM:10}
risk.policy.authentication-history-risk.source-ip-high-minimum=${RISK_AUTH_IP_HIGH_MINIMUM:20}
risk.policy.authentication-history-risk.medium-score=${RISK_AUTH_HISTORY_MEDIUM_SCORE:50}
risk.policy.authentication-history-risk.high-score=${RISK_AUTH_HISTORY_HIGH_SCORE:100}

# Exact IP addresses separated by commas. Empty by default.
risk.policy.priority-rules.blocked-ip-addresses=${RISK_BLOCKED_IP_ADDRESSES:}
