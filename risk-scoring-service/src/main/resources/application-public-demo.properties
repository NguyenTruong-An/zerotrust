# Public Demo contract only. Not a deployment manifest or a schema installer.
app.public-demo.mode=${PUBLIC_DEMO_MODE}
app.public-demo.academic-read-only=${PUBLIC_DEMO_ACADEMIC_READ_ONLY}
app.public-demo.environment=${PUBLIC_DEMO_ENVIRONMENT}
spring.datasource.url=${RISK_DB_URL}
spring.datasource.username=${RISK_DB_USERNAME}
spring.datasource.password=${RISK_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${RISK_JPA_DDL_AUTO:validate}
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.liquibase.enabled=false
spring.datasource.hikari.read-only=false
risk.security.require-https=true
spring.data.redis.host=${RISK_REDIS_HOST}
spring.data.redis.password=${RISK_REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true
# History uses Redis commands under a scoped ACL. The default INFO probe cannot verify that contract.
management.health.redis.enabled=false
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,redis,geoIp
server.ssl.enabled=true
server.ssl.key-store=${RISK_TLS_KEY_STORE}
server.ssl.key-store-password=${RISK_TLS_KEY_STORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${RISK_TLS_KEY_ALIAS}
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3
