name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-tests:
    name: Tests / ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: portal
            pom: pom.xml
            reports: target/surefire-reports
          - module: risk-service
            pom: risk-scoring-service/pom.xml
            reports: risk-scoring-service/target/surefire-reports
          - module: keycloak-extension
            pom: keycloak-risk-extension/pom.xml
            reports: keycloak-risk-extension/target/surefire-reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - name: Run tests
        run: bash mvnw --batch-mode --no-transfer-progress -f "${{ matrix.pom }}" test
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.module }}
          path: ${{ matrix.reports }}
          if-no-files-found: warn
          retention-days: 7

  frontend-checks:
    name: Frontend / lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check frontend
        run: npm run check
