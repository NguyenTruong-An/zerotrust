spring.datasource.url=jdbc:h2:mem:zerotrust;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

keycloak.admin.server-url=http://localhost:8180
keycloak.admin.realm=DoAn
keycloak.admin.client-id=test-client
keycloak.admin.client-secret=test-secret
keycloak.admin.connect-timeout=1s
keycloak.admin.read-timeout=1s
keycloak.admin.connection-pool-size=2
keycloak.admin.min-token-validity-seconds=10

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/DoAn
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/DoAn/protocol/openid-connect/certs
app.security.jwt.audience=zerotrust-api
app.security.cors.allowed-origins=http://localhost:3000
