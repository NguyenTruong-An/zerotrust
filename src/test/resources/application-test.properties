spring.datasource.url=jdbc:h2:mem:zerotrust;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

keycloak.admin.server-url=http://localhost:8180
keycloak.admin.realm=DoAn
keycloak.admin.client-id=test-client
keycloak.admin.client-secret=test-secret
keycloak.admin.connect-timeout=1s
keycloak.admin.read-timeout=1s
keycloak.admin.connection-pool-size=2
keycloak.admin.min-token-validity-seconds=10

spring.security.oauth2.client.provider.keycloak.authorization-uri=http://localhost/authorize
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost/token
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=http://localhost/jwks
spring.security.oauth2.client.provider.keycloak.user-info-uri=http://localhost/userinfo
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=test-bff
spring.security.oauth2.client.registration.keycloak.client-secret=test-bff-secret
spring.security.oauth2.client.registration.keycloak.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,roles

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
app.security.login-success-uri=/api/auth/session
app.security.logout-success-path=/api/auth/session
