# Public Demo contract only. Not a deployment manifest or a schema installer.
app.public-demo.mode=${PUBLIC_DEMO_MODE}
app.public-demo.academic-read-only=${PUBLIC_DEMO_ACADEMIC_READ_ONLY}
app.public-demo.environment=${PUBLIC_DEMO_ENVIRONMENT}
server.forward-headers-strategy=none
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.liquibase.enabled=false
spring.datasource.hikari.read-only=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI}
keycloak.admin.server-url=${KEYCLOAK_URL}
keycloak.admin.realm=${KEYCLOAK_REALM}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
