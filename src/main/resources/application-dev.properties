# Development keeps the BFF session in this Spring Boot process.
# No Docker or Redis process is required for this profile.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
app.security.login-success-uri=${LOGIN_SUCCESS_URI:/}
app.security.logout-success-path=${LOGOUT_SUCCESS_PATH:/}
spring.security.oauth2.client.registration.keycloak.redirect-uri=${KEYCLOAK_BFF_REDIRECT_URI:http://localhost:3000/login/oauth2/code/keycloak}

server.servlet.session.cookie.name=zerotrust-session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
