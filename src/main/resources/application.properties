spring.application.name=zerotrust
spring.profiles.default=dev

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vip_pro?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false
spring.data.redis.repositories.enabled=false

keycloak.admin.server-url=${KEYCLOAK_URL:http://localhost:8180}
keycloak.admin.realm=${KEYCLOAK_REALM:DoAn}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:zerotrust-provisioner}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
keycloak.admin.connect-timeout=${KEYCLOAK_CONNECT_TIMEOUT:3s}
keycloak.admin.read-timeout=${KEYCLOAK_READ_TIMEOUT:5s}
keycloak.admin.connection-pool-size=${KEYCLOAK_CONNECTION_POOL_SIZE:10}
keycloak.admin.min-token-validity-seconds=${KEYCLOAK_MIN_TOKEN_VALIDITY_SECONDS:30}

spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/DoAn}
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_BFF_CLIENT_ID:zerotrust-bff}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_BFF_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,roles

spring.session.timeout=30m
app.security.logout-success-path=/
