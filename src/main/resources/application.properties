spring.application.name=zerotrust
app.risk-admin.base-url=${PORTAL_RISK_BASE_URL:}
app.risk-admin.token-uri=${PORTAL_RISK_TOKEN_URI:}
app.risk-admin.client-id=${PORTAL_RISK_CLIENT_ID:zerotrust-portal-risk-admin}
app.risk-admin.client-secret=${PORTAL_RISK_CLIENT_SECRET:}
app.risk-admin.allow-http=${PORTAL_RISK_ALLOW_HTTP:false}
app.risk-admin.connect-timeout=${PORTAL_RISK_CONNECT_TIMEOUT:3s}
app.risk-admin.read-timeout=${PORTAL_RISK_READ_TIMEOUT:5s}
spring.profiles.default=dev

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vip_pro?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false
keycloak.admin.server-url=${KEYCLOAK_URL:http://localhost:8180}
keycloak.admin.realm=${KEYCLOAK_REALM:DoAn}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:zerotrust-provisioner}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
keycloak.admin.connect-timeout=${KEYCLOAK_CONNECT_TIMEOUT:3s}
keycloak.admin.read-timeout=${KEYCLOAK_READ_TIMEOUT:5s}
keycloak.admin.connection-checkout-timeout=${KEYCLOAK_CONNECTION_CHECKOUT_TIMEOUT:3s}
keycloak.admin.connection-pool-size=${KEYCLOAK_CONNECTION_POOL_SIZE:10}
keycloak.admin.min-token-validity-seconds=${KEYCLOAK_MIN_TOKEN_VALIDITY_SECONDS:30}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/DoAn}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/DoAn/protocol/openid-connect/certs}
app.security.jwt.audience=${KEYCLOAK_API_AUDIENCE:zerotrust-api}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
