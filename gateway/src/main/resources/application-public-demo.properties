# PROPOSED — NOT APPROVED: bounded source-test defaults, not a Production SLA (D-06 pending).
app.public-demo.mode=${PUBLIC_DEMO_MODE}
app.public-demo.academic-read-only=${PUBLIC_DEMO_ACADEMIC_READ_ONLY}
app.abuse.trusted-proxies=${GATEWAY_TRUSTED_PROXY_CIDRS}
app.abuse.api-bytes=${GATEWAY_API_MAX_BYTES:65536}
app.abuse.static-bytes=${GATEWAY_STATIC_MAX_BYTES:8192}
app.abuse.api-rate=${GATEWAY_API_RATE:10}
app.abuse.api-burst=${GATEWAY_API_BURST:20}
app.abuse.static-rate=${GATEWAY_STATIC_RATE:100}
app.abuse.static-burst=${GATEWAY_STATIC_BURST:200}
app.abuse.max-in-flight=${GATEWAY_MAX_IN_FLIGHT:32}
app.abuse.subject-concurrency=${GATEWAY_SUBJECT_CONCURRENCY:4}
app.abuse.static-concurrency=${GATEWAY_STATIC_CONCURRENCY:16}
app.abuse.max-keys=${GATEWAY_MAX_KEYS:4096}
app.abuse.idle-ttl=${GATEWAY_KEY_IDLE_TTL:PT60S}
app.abuse.body-timeout=${GATEWAY_BODY_TIMEOUT:PT2S}
app.abuse.request-timeout=${GATEWAY_REQUEST_TIMEOUT:PT15S}
server.forward-headers-strategy=none
server.max-http-request-header-size=${GATEWAY_MAX_HEADER_BYTES:16384}
server.netty.idle-timeout=${GATEWAY_IDLE_TIMEOUT:PT15S}
server.netty.max-keep-alive-requests=100
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=PT5S
spring.cloud.gateway.server.webflux.httpclient.pool.type=fixed
spring.cloud.gateway.server.webflux.httpclient.pool.max-connections=32
spring.cloud.gateway.server.webflux.httpclient.pool.acquire-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.pool.max-idle-time=PT15S
spring.cloud.gateway.server.webflux.httpclient.pool.max-life-time=PT60S
