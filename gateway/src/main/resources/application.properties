spring.application.name=zerotrust-gateway
server.port=${GATEWAY_PORT:8450}
server.forward-headers-strategy=none
app.routes.backend=${BACKEND_URL}
app.routes.frontend=${FRONTEND_URL}
app.security.jwt.issuer=${KEYCLOAK_ISSUER_URI}
app.security.jwt.jwks=${KEYCLOAK_JWK_SET_URI}
app.security.jwt.audience=${KEYCLOAK_API_AUDIENCE:zerotrust-api}
app.security.cors.origins=${CORS_ALLOWED_ORIGINS}
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=5s
spring.codec.max-in-memory-size=1MB
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
